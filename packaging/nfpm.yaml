name: tripwire
arch: amd64
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: Michael Barnathan <michael@barnathan.net>
description: |
  Credential-canary host-intrusion tripwire. Plants decoy Claude Code / Codex
  credential files under /etc, watches them with fanotify permission events, and
  runs a configurable alert/kill/poweroff response when a non-allowlisted process
  reads one. Installs alert-only; destructive actions require an explicit
  `tripwire arm`.
license: MIT
homepage: https://github.com/mbarnathan/tripwire

contents:
  - src: ./dist/tripwired
    dst: /usr/bin/tripwired
  - src: ./dist/tripwire
    dst: /usr/bin/tripwire
  - src: ./packaging/tripwired.service
    dst: /lib/systemd/system/tripwired.service
  - src: ./packaging/config/server.yaml
    dst: /usr/share/tripwire/server.yaml
  - src: ./packaging/config/workstation.yaml
    dst: /usr/share/tripwire/workstation.yaml

  # Each format wants the license text in its own place: Debian policy expects
  # /usr/share/doc/<pkg>/copyright, RPM convention is /usr/share/licenses/<pkg>/.
  - src: ./LICENSE
    dst: /usr/share/doc/tripwire/copyright
    packager: deb
  - src: ./LICENSE
    dst: /usr/share/licenses/tripwire/LICENSE
    packager: rpm

# The decoy files are deliberately NOT listed here. They are generated by the
# postinstall script so that `rpm -qf /etc/codex/auth.json` and
# `dpkg -S /etc/codex/auth.json` report them as owned by no package — the same
# answer a hand-configured credential file gives.

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh

overrides:
  rpm:
    depends:
      - systemd
  deb:
    depends:
      - systemd
