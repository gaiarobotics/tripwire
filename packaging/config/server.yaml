profile: server

# Installed ALERT-ONLY. Arming destructive actions takes three deliberate steps:
#   1. add kill and/or poweroff to the list below
#   2. run `tripwire test` and confirm the alert actually reaches you
#   3. run `tripwire arm`, then `systemctl restart tripwired`
# The daemon runs alert-only until all three are done, and drops back to
# alert-only after any trip until `tripwire reset`.
actions: [alert]

# hold: how long a hostile read is stalled inside open(), looking like slow I/O,
# while the ladder runs. Derived when unset: 3s alert-only, 15s destructive.
# Set `hold: 0s` to answer immediately.
# hold: 15s

alert_timeout: 10s

# The decoys: these paths are created on install, watched by the daemon,
# refreshed periodically, and removed on uninstall. Tripwire never overwrites a
# file it did not write, so a typo here costs an error, not the file.
#
# A bare path infers its credential schema from the name (codex/openai -> the
# Codex shape, aws -> an AWS credentials file, and so on; anything unrecognised
# -> the Claude shape). Where the name does not give it away, say so explicitly:
#   - { path: /srv/app/config/creds.json, kind: codex }
#     auto | claude | codex | aws | gcp | npm | pip | github | llm
#
# The npm, pip, AWS and gh paths below are deliberately NOT the ones those tools
# read (npm reads $PREFIX/etc/npmrc, pip reads /etc/pip.conf): a decoy the real
# client loads would hand a dead token to every build on the host.
bait:
  - /etc/claude-code/credentials.json
  - /etc/anthropic/claude.credentials.json
  - /etc/codex/auth.json
  - /etc/openai/codex-auth.json
  - /etc/aws/credentials
  - /etc/gcloud/service-account.json
  - /etc/npm/npmrc
  - /etc/pip/pip.conf
  - /etc/gh/hosts.yml

kill:
  scope: tree # pid | tree | session | loginuid
  max_kill: 50
poweroff:
  mode: graceful # graceful | hard (sync + SysRq)

sinks:
  # ntfy reaches a different device than the one about to power off — configure
  # at least one off-host sink before arming anything destructive.
  # ntfy:    { url: "https://ntfy.sh/your-topic", priority: urgent, tags: "rotating_light" }
  # webhook: { url: "https://example.com/hook", headers: { Authorization: "Bearer ..." } }
  # email:   { to: you@example.com, from: tripwire@localhost, smtp_addr: "" }
  journal: true

# Optional: generate decoy contents with a language model instead of the
# built-in templates, for decoys whose bait entry says `kind: llm`. Nothing
# below is consulted unless some entry asks for it, and the daemon never uses
# it — generation happens in `tripwire _place-bait` and `tripwire regenerate`,
# so the root daemon makes no outbound calls and needs no API key.
#
# llm:
#   provider: anthropic          # anthropic | openai-compatible
#   model: claude-opus-5
#   api_key_env: ANTHROPIC_API_KEY   # default per provider; keeps the key out of this file
#   # api_key_file: /etc/tripwire/llm.key
#   # base_url: http://localhost:11434/v1   # self-hosted or proxied endpoint
#   # timeout: 30s
#   # max_tokens: 8192
#   # effort: low                # anthropic only; omit unless your model accepts it
#   guidance: "a CI build host"  # shapes what the decoy pretends to be
#
# Generated decoys are written once and are not refreshed by the daemon. Run
# `tripwire regenerate` from a systemd timer or cron if you want them rewritten
# periodically, the way template decoys are.

# Allowlist benign readers. Every field set in a rule must match (AND); any rule
# matching makes the read benign. A rule with no fields matches nothing.
#
# Matching on exe alone is weak — an attacker can drop a binary at
# /usr/bin/updatedb. Pair exe with loginuid wherever you can.
#
# Fields: exe, uid, loginuid, unit (cgroup substring), ancestor (exe or comm of
# any ancestor), cap_eff (hex capability mask; the reader must hold every bit).
allow:
  # - { exe: /usr/bin/updatedb, loginuid: 4294967295, comment: "mlocate indexer, system context" }
  # - { exe: /usr/bin/aide, unit: aide.service, comment: "file integrity baseline" }
  # - { exe: /usr/sbin/rkhunter, comment: "rootkit scanner" }
  # - { ancestor: backupd, cap_eff: "0000000000000004", comment: "backup agent with CAP_DAC_READ_SEARCH" }

state_dir: /var/lib/tripwire
